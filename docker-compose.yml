name: go-ecommerce
networks:
    go_ecommerce_network:
        driver: bridge
services:
    database:
        container_name: database
        image: mysql:8.0
        restart: unless-stopped
        environment:
            - MYSQL_DATABASE=ecommerce
            - MYSQL_ROOT_PASSWORD=ecommerce@123
        ports:
            - '33306:3306'
        volumes:
            - database:/var/lib/mysql
            - ./.docker/init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - go_ecommerce_network
    redis:
        container_name: redis
        image: redis:alpine
        restart: unless-stopped
        ports:
            - '6380:6379'
        volumes:
            - redis_db:/data
        command: redis-server --save 20 1 --loglevel warning --requirepass 123456
        networks:
            - go_ecommerce_network
    kafka:
        container_name: kafka
        image: 'bitnami/kafka:latest'
        restart: unless-stopped
        ports:
            - '19092:9092'
        environment:
            - KAFKA_CFG_NODE_ID=1
            - KAFKA_CFG_PROCESS_ROLES=broker,controller
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
            - KAFKA_KRAFT_MODE=true
        networks:
            - go_ecommerce_network
    backend:
        container_name: go_backend
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            MODE: prod
        restart: unless-stopped
        ports:
            - '8000:8000'
        networks:
            - go_ecommerce_network
volumes:
    database:
        driver: local
    redis_db:
